<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohammad Haghighat | Security Research</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      max-width: 820px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 { color: #f0f6fc; margin-bottom: 0.2rem; }
    .subtitle { color: #8b949e; margin-top: 0; margin-bottom: 2rem; }
    h2 { color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; margin-top: 2.5rem; }
    .card {
      border: 1px solid #30363d;
      background: #161b22;
      padding: 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
    }
    .card h3 { margin: 0 0 0.5rem 0; }
    .card a { color: #58a6ff; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .tags { font-size: 0.85rem; color: #8b949e; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <h1>Mohammad Haghighat</h1>
  <p class="subtitle">Low-Level Reverse Engineering &bull; Windows Internals &bull; Threat Hunting &amp; Detection Engineering</p>

  <h2>Research &amp; Write-ups</h2>
  <div id="research-list">Loading...</div>

  <script>
    fetch('research/posts.json')
      .then(res => res.json())
      .then(posts => {
        document.getElementById('research-list').innerHTML = posts.map(post => `
          <div class="card">
            <h3><a href="research/post.html?p=${post.id}">${post.title}</a></h3>
            <p style="margin: 0;">${post.summary}</p>
            <div class="tags">${post.date} &bull; ${post.tags.join(' &bull; ')}</div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
