# Language & Timezone
lang: en
timezone: Asia/Tehran

# Site Info
title: Mohammad Haghighat
tagline: Binary Analysis | Reverse Engineering | Windows Internals
description: Technical write-ups on low-level Windows internals, binary analysis, and threat detection.
url: "https://mohammadmh121.github.io"

# Appearance
theme_mode: dark

# Author Details
author:
  name: Mohammad Haghighat

# Social & Sidebar Links
social:
  name: Mohammad Haghighat
  email: mohammadhaghighat854@gmail.com
  links:
    - https://github.com/mohammadmh121
    - https://www.linkedin.com/in/mohammad-haghighat-51b047219/

# Theme
theme: jekyll-theme-chirpy

paginate: 10

# Syntax Highlighting for Code & Disassembly
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      dynamic_title: false
      feedback: false
